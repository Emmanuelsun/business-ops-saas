<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f3d33">
  <title>Lumen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="app.html">
        <span class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="5" fill="#d9a441"></circle>
            <path d="M12 1v3M12 20v3M1 12h3M20 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="#d9a441" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </span>
        Lumen
      </a>
      <button class="btn btn-ghost btn-small" id="logout" type="button">Log out</button>
    </div>
  </header>

  <main>
    <div class="container">
      <p id="demo-banner" class="notice notice-gold" hidden>You are exploring a demo with sample data. It is private to you and is cleared automatically after 24 hours.</p>

      <section class="section">
        <h2 id="welcome">Welcome</h2>
        <p class="lead" id="subtitle">Loading your workspace...</p>
        <p id="error" class="notice" role="alert" hidden></p>

        <div class="grid grid-2">
          <article class="card">
            <div class="stat-label">AI calls used</div>
            <div class="stat-value" id="calls">&nbsp;</div>
            <div class="meter" aria-hidden="true"><div class="meter-fill" id="meter"></div></div>
          </article>
          <article class="card">
            <div class="stat-label">Plan</div>
            <div class="stat-value" id="plan">&nbsp;</div>
            <p id="plan-note">&nbsp;</p>
          </article>
        </div>
      </section>
    </div>
  </main>

  <script src="api.js"></script>
  <script>
    (async function () {
      if (!Lumen.getToken()) {
        window.location.href = "/app/";
        return;
      }

      document.getElementById("logout").addEventListener("click", Lumen.logOut);

      try {
        var me = await Lumen.get("/auth/me");
        var usage = await Lumen.get("/usage");

        document.getElementById("welcome").textContent = "Welcome, " + me.full_name;
        document.getElementById("subtitle").textContent = "You are signed in as the " + me.role + ".";
        document.getElementById("calls").textContent = usage.ai_calls_used + " / " + usage.ai_call_limit;

        var percent = usage.ai_call_limit > 0
          ? Math.min(100, Math.round((usage.ai_calls_used / usage.ai_call_limit) * 100))
          : 0;
        document.getElementById("meter").style.width = percent + "%";

        document.getElementById("plan").textContent =
          usage.plan.charAt(0).toUpperCase() + usage.plan.slice(1);
        document.getElementById("plan-note").textContent =
          "Up to " + usage.ai_call_limit + " AI calls on this plan.";

        document.getElementById("demo-banner").hidden = !usage.is_demo;
      } catch (error) {
        var box = document.getElementById("error");
        box.textContent = error.message;
        box.hidden = false;
        document.getElementById("subtitle").textContent = "";
      }
    })();
  </script>
</body>
</html>
<!-- End of file -->

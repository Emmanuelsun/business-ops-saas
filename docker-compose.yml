# Lumen: starts the app and its database together.
# Use: docker compose up --build   (then open http://localhost:8000)

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: business_ops
    volumes:
      - lumen_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d business_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/business_ops
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your environment or a .env file}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      DEMO_DAILY_LIMIT: ${DEMO_DAILY_LIMIT:-30}
      DEMO_AI_CALLS: ${DEMO_AI_CALLS:-10}
    ports:
      - "8000:8000"

volumes:
  lumen_data:

# End of file.